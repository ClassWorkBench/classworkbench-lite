<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
    <title>相机扫描</title>
    <link rel="stylesheet" href="src/styles/base.css">
    <link rel="stylesheet" href="src/styles/components.css">
    <style>
        /* 浮窗两种形态共用 */
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }
        * { box-sizing: border-box; }

        /* 收缩态：小圆形按钮 */
        .scan-float-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--accent, #3b82f6), #2563eb);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            /* 整窗可拖动（无拖动柄），按钮本身不可拖 */
            -webkit-app-region: drag;
        }
        .scan-float-btn svg {
            width: 26px;
            height: 26px;
            -webkit-app-region: no-drag;
            pointer-events: none;
        }
        .scan-float-btn .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 10px;
            background: #e23c2e;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 3px rgba(0,0,0,.3);
            -webkit-app-region: no-drag;
            pointer-events: none;
        }
        /* 点击区域：按钮上的羽毛图标区单独 no-drag 以便点击 */
        .scan-float-btn .hit {
            position: absolute;
            inset: 0;
            -webkit-app-region: no-drag;
            border-radius: 50%;
            cursor: pointer;
        }

        /* 展开态：清单面板 */
        .scan-panel {
            display: none;
            width: 364px;
            height: 488px;
            /* 对齐作业卡片浮窗的同款白色质感：高不透明度白底（卡片是白玻璃+学科色罩，这里只用纯白实现同等不透明），不用 backdrop blur */
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            flex-direction: column;
            color: var(--text-primary);
        }
        body.expanded .scan-float-btn { display: none; }
        body.expanded .scan-panel { display: flex; }
        body.collapsed .scan-panel { display: none; }

        .scan-panel-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--glass-border);
        }
        .scan-panel-head .ttl { font-weight: 700; font-size: 14px; flex: 1; }
        .scan-panel-head .cnt { font-size: 12px; color: var(--text-secondary); }
        .scan-btn {
            border: none;
            background: rgba(0,0,0,.05);
            border-radius: 8px;
            width: 28px;
            height: 28px;
            cursor: pointer;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .scan-btn:hover { background: rgba(0,0,0,.1); }

        /* 图片清单（横向滚动缩略图，每张带复选框） */
        .scan-thumbs {
            flex: 1;
            display: flex;
            gap: 10px;
            padding: 12px;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .scan-thumb {
            position: relative;
            width: 128px;
            height: 150px;
            flex: none;
        }
        .scan-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
        }
        .scan-thumb .chk {
            position: absolute;
            top: 6px;
            left: 6px;
            z-index: 2;
            width: 22px;
            height: 22px;
            appearance: none;
            -webkit-appearance: none;
            background: #fff;
            border: 2px solid rgba(0,0,0,.25);
            border-radius: 6px;
            cursor: pointer;
            display: grid;
            place-items: center;
            color: #fff;
        }
        .scan-thumb .chk:checked {
            background: var(--accent);
            border-color: var(--accent);
        }
        .scan-thumb .chk:checked::after {
            content: '✓';
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
        }
        .scan-thumb .idx {
            position: absolute;
            right: 6px;
            bottom: 6px;
            z-index: 2;
            background: rgba(0,0,0,.55);
            color: #fff;
            font-size: 11px;
            padding: 1px 7px;
            border-radius: 9px;
        }
        /* 单张插入按钮：覆盖在缩略图左下角（左上勾选、右下序号，互不冲突） */
        .scan-thumb .thumb-insert {
            position: absolute;
            left: 6px;
            bottom: 6px;
            z-index: 3;
            width: auto;
            height: 22px;
            padding: 0 10px;
            border-radius: 11px;
            background: rgba(30, 41, 59, .7);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .scan-thumb .thumb-insert:hover { background: var(--accent); }

        /* 底部操作 */
        .scan-panel-foot {
            padding: 10px 12px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .scan-actions {
            display: flex;
            gap: 8px;
        }
        .scan-act {
            flex: 1;
            padding: 9px 0;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .scan-act.primary { background: var(--accent); color: #fff; }
        .scan-act.ghost { background: rgba(0,0,0,.05); color: var(--text-primary); }
        .scan-tip { font-size: 11px; color: var(--text-secondary); line-height: 1.4; }
    </style>
</head>
<body class="collapsed">
    <!-- 收缩态：可拖动小按钮 -->
    <button class="scan-float-btn" id="floatBtn" aria-label="相机扫描，点击展开插入面板">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1.5 2H20a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3.5L9 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span class="badge" id="floatBadge" hidden>0</span>
        <span class="hit" id="floatHit"></span>
    </button>

    <!-- 展开态：插入清单面板 -->
    <div class="scan-panel" id="scanPanel" role="dialog" aria-label="相机扫描图片插入面板">
        <div class="scan-panel-head">
            <span class="ttl">选择要插入的图片</span>
            <span class="cnt" id="panelCnt"></span>
            <button class="scan-btn" id="closeBtn" type="button" title="放弃全部内容" aria-label="放弃全部内容">✕</button>
        </div>
        <div class="scan-thumbs" id="thumbs"></div>
        <div class="scan-panel-foot">
            <div class="scan-actions">
                <button class="scan-act ghost" id="saveBtn" type="button">保存为文件</button>
                <button class="scan-act primary" id="insertAllBtn" type="button">插入全部</button>
            </div>
            <div class="scan-tip">先点选目标输入框，再「插入全部」会逐张粘贴。单张图片可单击其左下角「插入」。左上角 ✕ 可放弃全部内容。</div>
        </div>
    </div>

    <script src="src/scripts/scan-floater.js"></script>
</body>
</html>
