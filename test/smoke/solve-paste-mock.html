<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>solve paste smoke mock</title>
</head>
<body>
    <!-- 贪婪编辑器：模拟豆包/DeepSeek 输入框对 paste 事件的两条解析路径
         greedy  — files 和 text/html 两条路径都插入 <img>（复现双插根因）
         fileOnly — 只处理 files 路径
         htmlOnly — 只处理 text/html 路径 -->
    <div id="editor" contenteditable="true" style="width:640px;height:400px;border:1px solid #999"></div>
    <script>
    (function () {
        var ed = document.getElementById('editor');
        var counts = { files: 0, html: 0 };
        var mode = 'greedy';

        window.setEditorMode = function (m) { mode = m; };

        ed.addEventListener('paste', function (e) {
            var inserted = false;
            var files = e.clipboardData ? e.clipboardData.files : null;
            var html = '';
            try { html = e.clipboardData ? e.clipboardData.getData('text/html') : ''; } catch (_) {}

            if (files && files.length && mode !== 'htmlOnly') {
                counts.files++;
                var img1 = document.createElement('img');
                img1.className = 'inserted from-file';
                img1.src = URL.createObjectURL(files[0]);
                img1.style.width = '160px';
                ed.appendChild(img1);
                inserted = true;
            }
            if (/<img[\s>]/i.test(html) && mode !== 'fileOnly') {
                counts.html++;
                var img2 = document.createElement('img');
                img2.className = 'inserted from-html';
                img2.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUg==';
                img2.style.width = '160px';
                ed.appendChild(img2);
                inserted = true;
            }
            if (inserted) e.preventDefault();
        });
        ed.focus();

        window.getInsertCounts = function () {
            return JSON.stringify({ files: counts.files, html: counts.html, total: counts.files + counts.html });
        };
        window.resetEditor = function (m) {
            mode = m || 'greedy';
            counts = { files: 0, html: 0 };
            ed.innerHTML = '';
            ed.focus();
            return true;
        };

        // 生成接近真实抓拍尺寸的测试图：1280×960、线条 + 文字 + 噪点，
        // 输出 PNG dataURL（体积与真实展台抓拍同一量级，杜绝"小图不反映真实情况"）。
        window.makeImageDataURL = function () {
            var c = document.createElement('canvas');
            c.width = 1280; c.height = 960;
            var g = c.getContext('2d');
            g.fillStyle = '#f7f7f2'; g.fillRect(0, 0, c.width, c.height);
            g.strokeStyle = '#333'; g.lineWidth = 3;
            for (var i = 0; i < 32; i++) {
                g.beginPath();
                g.moveTo(60 + (i * 47) % 1200, 70 + (i * 131) % 880);
                g.lineTo(60 + (i * 89) % 1200, 70 + (i * 211) % 880);
                g.stroke();
            }
            g.font = '44px sans-serif'; g.fillStyle = '#111';
            g.fillText('Solve Paste Smoke 1280x960', 90, 500);
            g.font = '30px sans-serif';
            g.fillText('question.png realistic-size test image', 90, 560);
            var d = g.getImageData(0, 0, c.width, c.height);
            for (var p = 0; p < d.data.length; p += 4) {
                var n = (Math.random() * 26) | 0;
                d.data[p] += n; d.data[p + 1] += n; d.data[p + 2] += n;
            }
            g.putImageData(d, 0, 0);
            return c.toDataURL('image/png');
        };
    })();
    </script>
</body>
</html>
